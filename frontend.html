<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Legal Bee — Bangladeshi Law RAG</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',system-ui,sans-serif;background:#0f172a;color:#e2e8f0;min-height:100vh}
.container{max-width:960px;margin:0 auto;padding:20px}
header{text-align:center;padding:30px 0 20px}
header h1{font-size:2.2em;background:linear-gradient(135deg,#818cf8,#c084fc);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:6px}
header p{color:#94a3b8;font-size:1em}
.api-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
.api-dot.online{background:#4ade80;animation:pulse 2s infinite}
.api-dot.offline{background:#f87171}
.api-status{text-align:center;font-size:.85em;color:#94a3b8;margin-bottom:16px}
.tabs{display:flex;gap:2px;margin-bottom:0;border-radius:10px 10px 0 0;overflow:hidden}
.tab{flex:1;padding:12px;text-align:center;background:#1e293b;color:#94a3b8;cursor:pointer;font-size:.9em;font-weight:600;border:none;transition:.2s}
.tab.active{background:#334155;color:#e2e8f0}
.tab:hover{background:#2d3a50}
.card{background:#1e293b;border-radius:0 0 12px 12px;padding:24px;box-shadow:0 4px 20px rgba(0,0,0,.3)}
.tab-card{border-radius:0 0 12px 12px}
.input-row{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap}
textarea,input[type=text]{flex:1;min-width:200px;padding:12px;background:#0f172a;border:1px solid #334155;border-radius:8px;color:#e2e8f0;font-size:.95em;font-family:inherit;resize:vertical;min-height:60px}
textarea:focus,input:focus{outline:none;border-color:#818cf8}
.row{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap;align-items:center}
.row label{color:#94a3b8;font-size:.85em;display:flex;align-items:center;gap:4px}
.row input[type=radio]{accent-color:#818cf8}
.row select{padding:8px 12px;background:#0f172a;border:1px solid #334155;border-radius:6px;color:#e2e8f0;font-size:.85em}
.btn{flex:1;padding:12px 20px;background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff;border:none;border-radius:8px;font-size:.95em;font-weight:600;cursor:pointer;transition:.2s}
.btn:hover{transform:translateY(-1px);box-shadow:0 4px 15px rgba(99,102,241,.4)}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.btn-outline{background:transparent;border:1px solid #334155;color:#94a3b8;flex:.3}
.btn-outline:hover{background:#2d3a50;box-shadow:none}
.response{margin-top:20px;display:none}
.response.show{display:block;animation:slideUp .4s ease-out}
.answer-box{background:#0f172a;border:1px solid #334155;border-radius:8px;padding:20px;line-height:1.7;font-size:.95em}
.answer-box h1{font-size:1.4em;color:#c084fc;margin:16px 0 8px}
.answer-box h2{font-size:1.15em;color:#818cf8;margin:14px 0 6px}
.answer-box h3{font-size:1em;color:#94a3b8;margin:10px 0 4px}
.answer-box p{margin:8px 0}
.answer-box blockquote{background:#1e293b;border-left:3px solid #818cf8;padding:10px 14px;margin:10px 0;border-radius:0 6px 6px 0;color:#cbd5e1}
.answer-box ul,.answer-box ol{padding-left:20px;margin:8px 0}
.answer-box code{background:#334155;padding:2px 6px;border-radius:4px;font-size:.9em}
.answer-box hr{border:none;border-top:1px solid #334155;margin:16px 0}
.answer-box strong{color:#e2e8f0}
.meta-row{display:flex;gap:12px;margin-top:14px;flex-wrap:wrap}
.badge{display:inline-block;padding:4px 10px;border-radius:12px;font-size:.78em;font-weight:600}
.badge-high{background:#064e3b;color:#4ade80}
.badge-medium{background:#78350f;color:#fbbf24}
.badge-low{background:#7f1d1d;color:#f87171}
.badge-info{background:#1e3a5f;color:#60a5fa}
.citations-box{margin-top:14px;background:#0f172a;border:1px solid #334155;border-radius:8px;padding:14px}
.citations-box h3{font-size:.9em;color:#94a3b8;margin-bottom:8px}
.cite-item{display:inline-block;background:#1e293b;color:#94a3b8;padding:3px 10px;border-radius:6px;margin:3px;font-size:.82em}
.status-msg{padding:10px 14px;border-radius:8px;margin-bottom:12px;font-size:.9em;display:none}
.status-msg.loading{display:block;background:#1e3a5f;color:#60a5fa}
.status-msg.error{display:block;background:#450a0a;color:#f87171}
.status-msg.success{display:block;background:#064e3b;color:#4ade80}
.spinner{display:inline-block;width:14px;height:14px;border:2px solid #334155;border-top:2px solid #818cf8;border-radius:50%;animation:spin .8s linear infinite;margin-right:8px;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes slideUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
@media(max-width:600px){.tabs{flex-direction:column}.tab{text-align:center}header h1{font-size:1.6em}}
</style>
</head>
<body>
<div class="container">
<header>
<h1>LEEGAL BEE</h1>
<p>Bangladeshi Legal RAG — Ask questions in English or Bengali</p>
</header>

<div class="api-status" id="apiStatus">
<span class="api-dot offline" id="apiDot"></span>
<span id="apiMsg">Checking API connection...</span>
</div>

<div class="tabs">
<button class="tab active" onclick="switchTab('chat')">Chat</button>
<button class="tab" onclick="switchTab('search')">Search</button>
<button class="tab" onclick="switchTab('analyze')">Analyze</button>
<button class="tab" onclick="switchTab('summary')">Summary</button>
</div>

<div class="card tab-card" id="card">
<!-- CHAT TAB -->
<div id="tab-chat">
<textarea id="chatQuestion" placeholder="Ask a legal question...&#10;E.g.: What is the punishment for theft under Bangladeshi law?&#10;Or: &#x09AC;&#x09BE;&#x0982;&#x09B2;&#x09BE;&#x09A6;&#x09C7;&#x09B6;&#x09C7; &#x099A;&#x09C1;&#x09B0;&#x09BF;&#x09B0; &#x09B6;&#x09BE;&#x09B8;&#x09CD;&#x09A4;&#x09BF; &#x0995;&#x09C0;?" rows="3"></textarea>
<div class="row">
<label><input type="radio" name="chatLang" value="auto" checked> Auto</label>
<label><input type="radio" name="chatLang" value="en"> EN</label>
<label><input type="radio" name="chatLang" value="bn"> BN</label>
<label style="margin-left:auto"><input type="radio" name="chatType" value="general" checked> General</label>
<label><input type="radio" name="chatType" value="lawyer"> Lawyer</label>
</div>
<div class="input-row">
<button class="btn" onclick="doChat()">Ask Question</button>
<button class="btn btn-outline" onclick="clearTab('chat')">Clear</button>
</div>
</div>

<!-- SEARCH TAB -->
<div id="tab-search" style="display:none">
<textarea id="searchQuery" placeholder="Search query...&#10;E.g.: Article 90E nomination rules" rows="2"></textarea>
<div class="row">
<input type="text" id="searchFilter" placeholder="Filter (optional): act_name, year, hierarchy.section..." style="flex:2">
<select id="searchTopK"><option value="5">Top 5</option><option value="8" selected>Top 8</option><option value="15">Top 15</option><option value="25">Top 25</option></select>
</div>
<div class="input-row">
<button class="btn" onclick="doSearch()">Search Laws</button>
<button class="btn btn-outline" onclick="clearTab('search')">Clear</button>
</div>
</div>

<!-- ANALYZE TAB -->
<div id="tab-analyze" style="display:none">
<textarea id="analyzeFacts" placeholder="Describe your situation...&#10;E.g.: My landlord increased rent by 50% without written notice. What are my rights?" rows="4"></textarea>
<div class="row">
<label><input type="radio" name="analyzeLang" value="auto" checked> Auto</label>
<label><input type="radio" name="analyzeLang" value="en"> EN</label>
<label><input type="radio" name="analyzeLang" value="bn"> BN</label>
</div>
<div class="input-row">
<button class="btn" onclick="doAnalyze()">Analyze Situation</button>
<button class="btn btn-outline" onclick="clearTab('analyze')">Clear</button>
</div>
</div>

<!-- SUMMARY TAB -->
<div id="tab-summary" style="display:none">
<input type="text" id="summaryAct" placeholder="Act name...&#10;E.g.: Representation of the People (Amendment) Act, 2026">
<div class="row">
<label><input type="radio" name="summaryLang" value="auto" checked> Auto</label>
<label><input type="radio" name="summaryLang" value="en"> EN</label>
<label><input type="radio" name="summaryLang" value="bn"> BN</label>
</div>
<div class="input-row">
<button class="btn" onclick="doSummary()">Summarize Act</button>
<button class="btn btn-outline" onclick="clearTab('summary')">Clear</button>
</div>
</div>

<!-- RESPONSE (shared) -->
<div class="response" id="response">
<div class="status-msg" id="statusMsg"></div>
<div class="answer-box" id="answerBox"></div>
<div class="meta-row" id="metaRow"></div>
<div class="citations-box" id="citationsBox" style="display:none">
<h3 id="citationsTitle">Citations</h3>
<div id="citationsList"></div>
</div>
</div>
</div>
</div>

<script>
const API = window.location.origin + '/api';
let currentTab = 'chat';

async function checkHealth() {
  const dot = document.getElementById('apiDot'), msg = document.getElementById('apiMsg');
  try {
    const r = await fetch(API + '/health');
    if (r.ok) { dot.className = 'api-dot online'; msg.textContent = 'Connected to Legal Bee API'; }
    else { dot.className = 'api-dot offline'; msg.textContent = 'API down (status ' + r.status + ')'; }
  } catch(e) { dot.className = 'api-dot offline'; msg.textContent = 'API not reachable (is server running on :8000?)'; }
}
checkHealth();

function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab').forEach((t,i,a) => { t.classList.toggle('active', t.textContent.toLowerCase().includes(tab) || (tab==='chat'&&i===0)||(tab==='search'&&i===1)||(tab==='analyze'&&i===2)||(tab==='summary'&&i===3)); });
  ['chat','search','analyze','summary'].forEach(t => { document.getElementById('tab-'+t).style.display = t===tab?'block':'none'; });
  hideResponse();
}

function showLoading(msg) { const s=document.getElementById('statusMsg');s.className='status-msg loading';s.innerHTML='<span class="spinner"></span>'+msg; document.getElementById('response').classList.add('show'); }
function showError(msg) { const s=document.getElementById('statusMsg');s.className='status-msg error';s.textContent=msg; document.getElementById('response').classList.add('show'); }
function showSuccess(msg) { const s=document.getElementById('statusMsg');s.className='status-msg success';s.textContent=msg; }
function hideResponse() { document.getElementById('response').classList.remove('show'); document.getElementById('answerBox').innerHTML=''; document.getElementById('metaRow').innerHTML=''; document.getElementById('citationsBox').style.display='none'; }

async function apiPost(path, body) {
  const r = await fetch(API + path, { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body) });
  if (!r.ok) { const e = await r.json().catch(()=>({})); throw new Error(e.detail || 'HTTP '+r.status); }
  return r.json();
}

function getLang(name) { const v=document.querySelector('input[name="'+name+'"]:checked'); return v?v.value:'auto'; }

function renderResult(data) {
  const ab = document.getElementById('answerBox');
  try { ab.innerHTML = marked.parse(data.answer_markdown || data.answer || ''); } catch(e) { ab.textContent = data.answer || ''; }
  const mr = document.getElementById('metaRow');
  let badges = '';
  if (data.confidence) { const c = data.confidence.toLowerCase(); badges += '<span class="badge badge-'+(c==='high'?'high':c==='medium'?'medium':'low')+'">Confidence: '+data.confidence+'</span>'; }
  if (data.query_type) badges += '<span class="badge badge-info">'+data.query_type+'</span>';
  if (data.language_detected) badges += '<span class="badge badge-info">'+data.language_detected+'</span>';
  if (data.execution_time_ms) badges += '<span class="badge badge-info">'+(data.execution_time_ms/1000).toFixed(2)+'s</span>';
  if (data.token_usage && data.token_usage.prompt_tokens) badges += '<span class="badge badge-info">'+data.token_usage.prompt_tokens+' prompt / '+data.token_usage.completion_tokens+' completion tokens</span>';
  mr.innerHTML = badges;
  const cb = document.getElementById('citationsBox');
  const hasCitations = data.citations && data.citations.length > 0;
  const hasChunks = data.retrieved_chunks && data.retrieved_chunks.length > 0;
  if (hasCitations || hasChunks) {
    cb.style.display = 'block';
    document.getElementById('citationsTitle').textContent = 'Citations (' + (data.citations?data.citations.length:0) + ') · Retrieved Chunks (' + (data.retrieved_chunks?data.retrieved_chunks.length:0) + ')';
    let html = '';
    if (data.citations) data.citations.forEach(c => { html += '<span class="cite-item">'+escapeHtml(c)+'</span>'; });
    if (data.retrieved_chunks) {
      data.retrieved_chunks.forEach(c => {
        html += '<div class="cite-item" style="display:block;text-align:left;margin:6px 3px;padding:8px 12px" title="'+escapeHtml(c.text||'').slice(0,200)+'">';
        html += '<strong>'+escapeHtml(c.citation||c.chunk_id||'chunk')+'</strong>';
        if (c.score) html += ' <span style="color:#818cf8">'+c.score.toFixed(3)+'</span>';
        if (c.chunk_type) html += ' ['+c.chunk_type+']';
        html += '</div>';
      });
    }
    document.getElementById('citationsList').innerHTML = html;
  } else { cb.style.display = 'none'; }
}

function escapeHtml(s) { const d=document.createElement('div');d.textContent=s;return d.innerHTML; }

async function doChat() {
  const q = document.getElementById('chatQuestion').value.trim();
  if (!q || q.length < 3) { showError('Please enter a question (min 3 characters)'); return; }
  const lang = getLang('chatLang'), ut = document.querySelector('input[name="chatType"]:checked').value;
  showLoading('Searching legal database...');
  try {
    const data = await apiPost('/chat', { question:q, language:lang==='auto'?null:lang, user_type:ut });
    showSuccess('Answer ready');
    renderResult(data);
    checkHealth();
  } catch(e) { showError(e.message); }
}

async function doSearch() {
  const q = document.getElementById('searchQuery').value.trim();
  if (!q) { showError('Enter a search query'); return; }
  const fStr = document.getElementById('searchFilter').value.trim();
  let filters = null;
  if (fStr) { try { filters = JSON.parse(fStr); } catch(e) { showError('Invalid filter JSON: '+e.message); return; } }
  const topk = parseInt(document.getElementById('searchTopK').value);
  showLoading('Searching...');
  try {
    const data = await apiPost('/search', { query:q, filters:filters, top_k:topk });
    showSuccess('Results ready');
    renderResult(data);
  } catch(e) { showError(e.message); }
}

async function doAnalyze() {
  const facts = document.getElementById('analyzeFacts').value.trim();
  if (!facts || facts.length < 5) { showError('Please describe your situation (min 5 characters)'); return; }
  const lang = getLang('analyzeLang');
  showLoading('Analyzing your situation...');
  try {
    const data = await apiPost('/analyze', { facts:facts, language:lang==='auto'?null:lang });
    showSuccess('Analysis ready');
    renderResult(data);
  } catch(e) { showError(e.message); }
}

async function doSummary() {
  const act = document.getElementById('summaryAct').value.trim();
  if (!act) { showError('Enter an act name'); return; }
  const lang = getLang('summaryLang');
  showLoading('Summarizing...');
  try {
    const data = await apiPost('/summary', { act_name:act, language:lang==='auto'?null:lang });
    showSuccess('Summary ready');
    renderResult(data);
  } catch(e) { showError(e.message); }
}

function clearTab(tab) {
  const ids = {chat:'chatQuestion',search:'searchQuery',analyze:'analyzeFacts',summary:'summaryAct'};
  const el = document.getElementById(ids[tab]); if (el) el.value = '';
  if (tab === 'search') document.getElementById('searchFilter').value = '';
  hideResponse();
}

document.getElementById('chatQuestion').addEventListener('keydown', e => { if (e.ctrlKey && e.key === 'Enter') doChat(); });
</script>
</body>
</html>
